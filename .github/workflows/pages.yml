name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les pushes rapprochés annulent le précédent.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Recompile cards/*.md : le site ne dépend pas d'un app/cards.js à jour
      # dans le commit.
      - name: Compiler les fiches
        run: node build.mjs

      - uses: actions/configure-pages@v5

      # app/ devient la racine du site publié.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deploy
        uses: actions/deploy-pages@v4

  # Signale un app/cards.js périmé dans le commit. Volontairement un job à part,
  # en parallèle du déploiement plutôt qu'une étape dedans : le site est juste
  # de toute façon (il est recompilé ci-dessus), donc un artefact périmé ne doit
  # pas empêcher de publier — sinon éditer une fiche depuis l'interface web de
  # GitHub, où aucun hook ne tourne, bloquerait la mise en ligne à tous les coups.
  # Ce qui casse alors, c'est la promesse « cloner et ouvrir app/index.html ».
  verifier-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: cards.js correspond-il aux fiches ?
        run: |
          node build.mjs
          git diff --exit-code -- app/cards.js || {
            echo "::error::app/cards.js ne correspond pas à cards/*.md. Lance « npm run build » et commite le résultat (git config core.hooksPath .githooks l'automatise)."
            exit 1
          }
