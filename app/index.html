<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16151a" media="(prefers-color-scheme: dark)" />
    <title>Iron Ideas</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">Iron<span>Ideas</span></h1>
      <nav class="tabs" id="tabs">
        <button class="tab is-active" data-view="review">Réviser</button>
        <button class="tab" data-view="browse">Parcourir</button>
      </nav>
      <p class="count" id="count"></p>
    </header>

    <details class="filters" id="filters">
      <summary>
        <span class="summary-label">Filtres</span>
        <span class="summary-state" id="filter-state"></span>
      </summary>
      <div class="filters-body" id="filters-body"></div>
    </details>

    <main id="view"></main>

    <footer class="keys" id="keys"></footer>

    <div class="peek" id="peek" hidden></div>

    <div class="toast" id="toast" role="status" hidden>
      <span>Fiches mises à jour</span>
      <button data-act="reload">recharger</button>
    </div>

    <script src="cards.js"></script>
    <script src="app.js"></script>
  </body>
</html>
